name: Docker
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
permissions: {}
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/nrosier/walley
jobs:
  docker-build:
    name: docker-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: walley:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name walley-smoke -p 127.0.0.1:3000:3000 -e APP_SECRET="$(openssl rand -base64 48)" walley:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:3000/api/health)" = '{"status":"ok"}'
          curl -fsS http://127.0.0.1:3000/ | grep -q 'id="root"'
          docker exec walley-smoke ls dist/server/db/migrations/meta/_journal.json
          check_db='
            const Database = require("better-sqlite3");
            const fs = require("node:fs");
            const db = new Database("/data/walley.db", { readonly: true });
            const tables = db
              .prepare("SELECT name FROM sqlite_master WHERE type = ? AND name NOT LIKE ? ORDER BY name")
              .all("table", "sqlite_%")
              .map((r) => r.name)
              .join(",");
            const expected = "__drizzle_migrations,matches,sessions,user_configs,user_identities,users";
            if (tables !== expected) throw new Error("unexpected tables: " + tables);
            const journal = JSON.parse(fs.readFileSync("dist/server/db/migrations/meta/_journal.json", "utf8"));
            const count = db.prepare("SELECT count(*) AS n FROM __drizzle_migrations").get().n;
            if (count !== journal.entries.length) throw new Error("journal count " + count + " != " + journal.entries.length);
            console.log("db ok: " + count + " migration(s)");
          '
          docker exec walley-smoke node -e "$check_db"
          docker restart -t 10 walley-smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:3000/api/health)" = '{"status":"ok"}'
          docker exec walley-smoke node -e "$check_db"
          docker stop -t 10 walley-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' walley-smoke)" = "0"
      - name: Container logs
        if: failure()
        run: docker logs walley-smoke || true
  docker-publish:
    name: docker-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
