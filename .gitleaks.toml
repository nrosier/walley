# Extends gitleaks' default rules. Only the paths listed here are exempt, and only
# for the rule named. Everything else is scanned as before.

[extend]
useDefault = true

[[allowlists]]
description = "HKDF golden test vector: a fixed public test output, not a credential (#14)"
paths = ['''src/server/crypto/keys\.test\.ts$''']
rules = ["generic-api-key"]

[[allowlists]]
description = "Cache test fixture: fake credentials that prove the cache never stores secrets (not real keys)"
paths = ['''src/server/cache/upstream-cache\.test\.ts$''']
rules = ["generic-api-key"]

[[allowlists]]
description = "Fake sentinel strings the secret-leak tests assert never appear in a response (#223)"
regexes = ['''-SENTINEL-[0-9a-f]{4}\b''']
rules = ["generic-api-key"]
